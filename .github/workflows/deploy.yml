name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build Spring Boot application
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 4. Login to ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-north-1 |
          docker login --username AWS --password-stdin \
          202029085969.dkr.ecr.eu-north-1.amazonaws.com

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t 202029085969.dkr.ecr.eu-north-1.amazonaws.com/spring-app:${{ github.sha }} .

      # 6. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            202029085969.dkr.ecr.eu-north-1.amazonaws.com/spring-app:${{ github.sha }}

      # 7. Deploy to ECS
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster spring-cluster \
            --service spring-service \
            --force-new-deployment
